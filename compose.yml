# Docker Compose starts the manager. agent-compose.yml describes its task guests.
name: sirna-pi
services:
  agent-tools-relay:
    # Reuse our already-verified Node guest by immutable local image ID.
    image: sha256:e34a8f3fe6b2b74a3fa7f1a6143a126ae1e5414fa8a334c7bba82fe57d28971b
    pull_policy: never
    entrypoint: [/usr/bin/node, /relay/relay.mjs]
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 128m
    volumes:
      - type: bind
        source: ./containers/agent-tools-relay/relay.mjs
        target: /relay/relay.mjs
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./runtime/agent-tools
        target: /run/sirna-tools
        read_only: true
        bind: {create_host_path: false}
    restart: unless-stopped
    networks:
      default:
        aliases: [agent-tools-relay]
  agent-compose:
    image: chaitin/agent-compose:v2609.3.0@sha256:91168af6c048ca811cff33a6fddbb1c176b1636456add94fb506d9b9952d0cb3
    platform: linux/amd64
    entrypoint: [/usr/bin/tini, --, /usr/bin/python3, /project/controller-entrypoint.py]
    command: [daemon]
    environment:
      RUNTIME_DRIVER: docker
      DATA_ROOT: /data
      HTTP_LISTEN: 0.0.0.0:7410
      DOCKER_HOST: unix:///var/run/docker.sock
      AGENT_COMPOSE_SOCKET: /var/run/agent-compose.sock
      AGENT_COMPOSE_HOST: ""
      # Guests reach the model facade through the private project network.
      AGENT_COMPOSE_RUNTIME_BASE_URL: http://agent-compose:7410
      DEFAULT_IMAGE: sirna-pi-guest:pi1.2.0
    env_file:
      - path: ./runtime/agent-compose/control.env
        required: true
    volumes:
      - type: bind
        source: ./containers/agent-compose/entrypoint.py
        target: /project/controller-entrypoint.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docs/auth.json
        target: /run/secrets/minimax-api-key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./config/agent-compose-models.json
        target: /data/models.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./runtime/docker/run/docker.sock
        target: /var/run/docker.sock
        bind:
          create_host_path: false
      - type: bind
        source: ./runtime/agent-compose/data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./agent-compose.yml
        target: /project/agent-compose.yml
        read_only: true
        bind:
          create_host_path: false
    working_dir: /project
    ports:
      - "127.0.0.1:7410:7410"
    restart: unless-stopped
    healthcheck:
      test: [CMD, /app/agent-compose, --json, status]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      default:
        aliases: [agent-compose]
